name: build

on:
  push:
    branches: [ main, "release/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  framework:
    name: framework (unit tests + bytecode baselines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 21 is listed last and therefore becomes JAVA_HOME: Gradle 8.11.1 does not
      # run on JDK 24+. 17 and 25 are installed so the toolchain resolver can use
      # them for per-module compilation targets without downloading anything.
      - name: Set up JDKs 17, 25, 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, test and verify bytecode baselines
        run: ./gradlew build --stacktrace

      - name: Verify the configuration cache is reusable
        run: |
          ./gradlew build --configuration-cache | tee cc.log
          grep -q "Configuration cache entry reused" cc.log \
            || { echo "::error::configuration cache was not reused — a task declares its inputs incorrectly"; exit 1; }

      - name: Verify the bytecode baseline guard actually fails when violated
        run: |
          cp format/build.gradle.kts /tmp/format-build.bak
          printf '\ntasks.withType<JavaCompile>().configureEach { options.release.set(17) }\n' >> format/build.gradle.kts
          if ./gradlew :format:verifyBytecodeBaseline --rerun-tasks -q > /tmp/guard.log 2>&1; then
            cp /tmp/format-build.bak format/build.gradle.kts
            echo "::error::OMNI-1040 guard did not fail on a deliberate violation"
            exit 1
          fi
          grep -q "OMNI-1040" /tmp/guard.log \
            || { cp /tmp/format-build.bak format/build.gradle.kts; echo "::error::guard failed without the OMNI-1040 code"; exit 1; }
          cp /tmp/format-build.bak format/build.gradle.kts
          echo "guard verified: OMNI-1040 raised as expected"

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests/**
            */build/test-results/**
            */build/reports/fabricmultiloader/**
          if-no-files-found: ignore
