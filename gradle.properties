# ---------------------------------------------------------------------------
#  FabricMultiLoader — build configuration
# ---------------------------------------------------------------------------

group = dev.fabricmultiloader
version = 1.0.0-SNAPSHOT

# --- Gradle behaviour ------------------------------------------------------
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.configuration-cache.problems = fail
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# --- Toolchains ------------------------------------------------------------
# Compiler JDK used for every module. Bytecode targets are set per module via
# --release (8 for format/api/runtime/processor, 17 for gradle-plugin/testing).
fabricmultiloader.toolchain = 21

# --- Binary compatibility --------------------------------------------------
# Baseline version for the API compatibility check. Empty until 1.0.0 is
# published; the check is skipped while unset (implementation step 6).
fabricmultiloader.apiBaseline =
